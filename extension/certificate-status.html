<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verificação do certificado — NFSe Analyzer</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; background: #f4f6ff; color: #1b2741; }
    main { box-sizing: border-box; width: min(440px, calc(100% - 32px)); padding: 42px; border-radius: 24px; background: #fff; box-shadow: 0 18px 55px #263e8517; text-align: center; }
    .icon { width: 76px; height: 76px; margin: 0 auto 22px; border-radius: 50%; display: grid; place-items: center; background: #edf1ff; color: #586be6; font-size: 38px; }
    .checking .icon::after { content: ""; width: 34px; height: 34px; border: 4px solid #c9d3ff; border-top-color: #586be6; border-radius: 50%; animation: spin .8s linear infinite; }
    .success .icon { background: #e8f7f0; color: #28835c; animation: pop .45s ease both; }
    .error .icon { background: #fff0ef; color: #b54c4c; }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { margin: 0; color: #65728c; line-height: 1.55; }
    .hint { margin-top: 18px; font-size: 13px; }
    button { display: none; margin: 24px auto 0; padding: 11px 22px; border: 0; border-radius: 10px; background: #586be6; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    .error button { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pop { 0% { transform: scale(.5); opacity: 0; } 70% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .checking .icon::after, .success .icon { animation: none; } }
  </style>
  <script src="certificate-status.js" defer></script>
</head>

<body>
  <main id="status" class="checking" role="status" aria-live="polite">
    <div id="icon" class="icon" aria-hidden="true"></div>
    <h1 id="title">Verificando certificado…</h1>
    <p id="description">O Chrome pode solicitar que você selecione seu certificado digital.</p>
    <p class="hint">Se o Chrome já escolheu um certificado para o ADN, ele pode reutilizá-lo sem mostrar a lista. A extensão não consegue trocar essa escolha automaticamente.</p>
    <button id="retry" type="button">Tentar selecionar novamente</button>
  </main>
</body>

</html>
