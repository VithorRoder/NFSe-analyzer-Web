<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NFSe Analyzer</title>
  <style>
    body {
      font: 13px system-ui, sans-serif;
      width: 290px;
      margin: 0;
      padding: 18px;
      color: #1b2741
    }

    h1 {
      font-size: 17px;
      margin: 0 0 8px
    }

    p {
      line-height: 1.5;
      color: #66728a;
      margin: 0 0 14px
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 9px;
      background: #5274f4;
      color: #fff;
      padding: 12px;
      font-weight: 700;
      cursor: pointer
    }

    button:disabled {
      background: #b3bed9;
      cursor: not-allowed
    }

    #test-adn {
      margin-top: 12px;
      background: #edf1ff;
      color: #4056a8
    }

    #adn-status {
      margin-top: 8px;
      color: #53617b;
      line-height: 1.4
    }

    #open-adn {
      display: none;
      margin-top: 8px;
      background: #edf1ff;
      color: #4056a8
    }
  </style>
  <script src="popup.js" defer></script>
</head>

<body>
  <h1>NFSe Analyzer</h1>
  <p>Use o certificado selecionado no Chrome para baixar XMLs pelo ADN e organizar as notas no site.</p>
  <button id="open-site" type="button">Abrir NFSe Analyzer</button>
  <button id="test-adn" type="button">Testar acesso ao ADN</button>
  <div id="adn-status" role="status" aria-live="polite"></div>
  <button id="open-adn" type="button">Abrir ADN e selecionar certificado</button>
</body>

</html>
