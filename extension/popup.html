<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NFSe Analyzer</title>
  <style>
    body {
      font: 13px system-ui, sans-serif;
      width: 290px;
      margin: 0;
      padding: 18px;
      color: #1b2741
    }

    h1 {
      font-size: 17px;
      margin: 0 0 8px
    }

    p {
      line-height: 1.5;
      color: #66728a;
      margin: 0 0 14px
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 9px;
      background: #5274f4;
      color: #fff;
      padding: 12px;
      font-weight: 700;
      cursor: pointer
    }

    button:disabled {
      background: #b3bed9;
      cursor: not-allowed
    }

    #open-site {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border-radius: 12px;
      background: linear-gradient(135deg, #586be6, #4158cf);
      box-shadow: 0 9px 20px #4258cf33;
      font-size: 14px;
      text-align: left
    }

    #open-site:hover {
      background: linear-gradient(135deg, #4b60df, #354cc4)
    }

    #open-site span {
      font-size: 20px;
      line-height: 1
    }

    #select-certificate {
      margin-top: 12px;
      background: #edf1ff;
      color: #4056a8
    }

    .certificate-note {
      margin: 12px 0 0;
      font-size: 12px
    }

  </style>
  <script src="popup.js" defer></script>
</head>

<body>
  <h1>NFSe Analyzer</h1>
  <p>Verifique o acesso ao ADN com o certificado em uso no Chrome e depois baixe as notas no site.</p>
  <button id="open-site" type="button">Acessar site e baixar notas <span aria-hidden="true">↗</span></button>
  <button id="select-certificate" type="button">Verificar certificado em uso</button>
  <p class="certificate-note">Para trocar o certificado, digite <code>chrome://restart</code> na barra de endereços do Chrome. Depois, verifique novamente e escolha o outro certificado.</p>
</body>

</html>
